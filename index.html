<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="eLoyer Kinshasa — La plateforme officielle de gestion locative et fiscale de la Ville de Kinshasa" />
    <meta name="theme-color" content="#0A1628" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Web fonts load off the critical path (font-display: swap keeps text visible
      meanwhile). The link has no `rel` until a script below activates it: on most
      routes immediately, on auth routes only once React has replaced the static
      shell — see the shell script at the end of <body>.
    -->
    <link
      id="app-fonts"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Caveat:wght@700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Caveat:wght@700&display=swap"
      />
    </noscript>
    <!--
      Critical CSS for the static landing shell below (#lp-shell). Self-contained so the
      shell paints from the HTML alone; the bundled stylesheet is loaded without blocking
      rendering (see the stylesheet transform in vite.config.ts) and React boots only once
      it has arrived.
    -->
    <style>
      /*
        Metric-compatible stand-in for Inter while the web font loads (same face as
        --font-sans in src/styles/index.css — keep both in sync). Scaled ~1.5% wider
        and taller than Inter so text painted before the web font arrives is never
        smaller than its final rendering: the shell's first paint stays the LCP.
      */
      @font-face{font-family:"Inter Fallback";src:local("Roboto"),local("Roboto-Regular"),local("Arial"),local("ArialMT"),local("Liberation Sans"),local("Arimo"),local("Helvetica Neue"),local("Helvetica");size-adjust:109%;ascent-override:98.2%;descent-override:27.5%;line-gap-override:0%}
      body{margin:0}
      /*
        Same scrollbar as src/styles/index.css. Without it the shell lays out
        against Chrome's 15 px classic scrollbar and the app stylesheet later
        widens the viewport by 7 px, so React's hero paints strictly larger than
        the shell's and becomes a new, later LCP candidate on desktop.
      */
      ::-webkit-scrollbar{width:8px;height:8px}
      ::-webkit-scrollbar-track{background:#f1f5f9}
      ::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:4px}
      #lp-shell{--sh-navy:#0a1628;--sh-nav:80px;background:#fff;font-family:Inter,"Inter Fallback",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
      #lp-shell .sh-nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.86);border-bottom:1px solid #e5e9f0}
      #lp-shell .sh-wrap{box-sizing:border-box;display:flex;align-items:center;height:var(--sh-nav);width:100%;max-width:1280px;margin-inline:auto;padding-inline:24px}
      #lp-shell .sh-id{display:flex;align-items:center;gap:12px}
      #lp-shell .sh-id img{display:block;width:40px;height:40px}
      #lp-shell .sh-sep,#lp-shell .sh-cap{display:none}
      #lp-shell .sh-word{display:flex;flex-direction:column;line-height:1;font-family:Poppins,ui-sans-serif,system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;font-size:18px}
      #lp-shell .sh-word b{font-weight:inherit;color:#0077b6}
      #lp-shell .sh-word i{font-style:normal;color:var(--sh-navy)}
      #lp-shell .sh-flag{display:block;height:3px;width:100%;background:linear-gradient(90deg,#009fe3 0 33.333%,#ffdd00 33.333% 66.666%,#ef3e42 66.666% 100%)}
      #lp-shell .sh-hero{position:relative;min-height:max(calc(100svh - var(--sh-nav) - 3px),700px);background:var(--sh-navy);isolation:isolate;overflow:hidden}
      #lp-shell .sh-bg{position:absolute;inset:0;z-index:-3}
      #lp-shell .sh-bg img{width:100%;height:100%;object-fit:cover;object-position:62% 40%;transform:scale(1.04)}
      #lp-shell .sh-overlay{position:absolute;inset:0;z-index:-2;background:linear-gradient(135deg,rgba(10,22,40,.95) 0%,rgba(10,22,40,.75) 50%,rgba(0,159,227,.3) 100%)}
      #lp-shell .sh-glow{position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 50% 45% at 78% 42%,rgba(0,159,227,.28),transparent 70%),radial-gradient(ellipse 30% 30% at 88% 70%,rgba(255,221,0,.14),transparent 70%)}
      @media (min-width:640px){
        #lp-shell .sh-id{gap:16px}
        #lp-shell .sh-id img{width:48px;height:48px}
        #lp-shell .sh-sep{display:block;height:36px;width:1px;background:#e5e9f0}
        #lp-shell .sh-word{font-size:22px}
        #lp-shell .sh-word b{color:#0086c2}
        #lp-shell .sh-cap{display:block;margin-top:5px;font-family:Inter,"Inter Fallback",ui-sans-serif,system-ui,sans-serif;font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#5b6b80}
      }
      @media (min-width:768px){#lp-shell .sh-wrap{padding-inline:40px}}
      @media (max-width:1023px){
        #lp-shell .sh-bg{inset:0 0 auto 0;height:max(calc(100svh - var(--sh-nav) - 3px),700px);mask-image:linear-gradient(to bottom,#000 58%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,#000 58%,transparent 100%)}
      }
      /* Auth shell (#auth-shell) — geometry mirrors auth.css; keep both in sync. */
      #auth-shell{--as-navy:#0a1628;--as-topbar:72px;--as-body-top:clamp(8px,calc(50svh - 400px),120px);display:grid;grid-template-columns:minmax(0,1fr);min-height:100svh;background:#fff;font-family:Inter,"Inter Fallback",ui-sans-serif,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;color:#1a1a1a}
      /* Same box model and [hidden] semantics as Tailwind preflight, so nothing resizes when the app stylesheet lands. */
      #auth-shell *,#auth-shell *::before,#auth-shell *::after{box-sizing:border-box}
      #auth-shell [hidden]{display:none!important}
      #auth-shell p{margin:0}
      #auth-shell .as-flag{display:block;height:3px;width:100%;background:linear-gradient(90deg,#009fe3 0 33.333%,#ffdd00 33.333% 66.666%,#ef3e42 66.666% 100%)}
      #auth-shell .as-main{position:relative;display:flex;flex-direction:column;min-height:100svh}
      #auth-shell .as-topbar{display:flex;align-items:center;justify-content:space-between;height:var(--as-topbar);padding:0 24px}
      #auth-shell .as-brand{display:flex;align-items:center;gap:12px}
      #auth-shell .as-brand img{display:block;width:40px;height:40px}
      #auth-shell .as-word{font-family:Poppins,ui-sans-serif,system-ui,sans-serif;font-weight:700;font-size:18px;letter-spacing:-.02em;line-height:1}
      #auth-shell .as-word b{font-weight:inherit;color:#0077b6}
      #auth-shell .as-word i{font-style:normal;color:var(--as-navy)}
      #auth-shell .as-lang{width:44px;height:32px;border-radius:8px;background:#f5f7fa}
      #auth-shell .as-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:var(--as-body-top) 24px 40px}
      #auth-shell .as-card{width:100%;max-width:440px}
      #auth-shell .as-title{margin:0;font-family:Poppins,ui-sans-serif,system-ui,sans-serif;font-weight:700;font-size:32px;line-height:1.15;letter-spacing:-.02em;color:var(--as-navy)}
      #auth-shell .as-sub{margin:8px 0 0;font-size:15px;line-height:1.5;color:#475569}
      #auth-shell .as-tabs{display:flex;gap:24px;margin-top:32px;padding-bottom:12px;border-bottom:1px solid #e5e9f0}
      #auth-shell .as-tabs span{display:block;height:20px;width:80px;border-radius:4px;background:#f5f7fa}
      #auth-shell .as-tabs span:first-child{background:#e8f6fc}
      #auth-shell .as-field{height:56px;margin-top:20px;border-radius:12px;border:1.5px solid #e5e9f0;background:#fff}
      #auth-shell .as-btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;margin-top:20px;border-radius:12px;background:#0077b6;color:#fff;font-family:Poppins,ui-sans-serif,system-ui,sans-serif;font-size:16px;font-weight:600;line-height:1;box-shadow:0 1px 2px rgba(10,22,40,.08),0 10px 24px -8px rgba(0,159,227,.55)}
      #auth-shell .as-btn svg{display:block}
      #auth-shell .as-panel{display:none}
      #auth-shell.as--centered{background:linear-gradient(180deg,#fff 0%,#f5f7fa 100%)}
      #auth-shell.as--centered::before{content:'';position:absolute;inset:0 0 auto 0;height:360px;pointer-events:none;background:linear-gradient(90deg,rgba(0,159,227,.18) 0%,rgba(255,221,0,.16) 50%,rgba(239,62,66,.14) 100%);mask-image:linear-gradient(to bottom,#000 0%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 100%)}
      #auth-shell.as--centered .as-card{padding:32px 24px;border-radius:20px;background:#fff;border:1px solid #e5e9f0;box-shadow:0 1px 2px rgba(10,22,40,.04),0 12px 32px rgba(10,22,40,.08),0 32px 64px -24px rgba(10,22,40,.14);min-height:420px;box-sizing:border-box}
      #auth-shell.as--centered .as-badge{width:64px;height:64px;margin:0 auto 24px;border-radius:999px;background:#009fe3;flex-shrink:0}
      #auth-shell.as--centered .as-badge--yellow{background:#ffdd00}
      #auth-shell.as--centered .as-title,#auth-shell.as--centered .as-sub{text-align:center}
      #auth-shell .as-back{height:32px;margin-bottom:8px}
      #auth-shell .as-otp{display:flex;justify-content:center;gap:8px;margin-top:32px}
      #auth-shell .as-otp span{width:46px;height:58px;border-radius:12px;border:2px solid #e5e9f0;background:#fff}
      @media (min-width:421px){#auth-shell .as-otp{gap:12px}#auth-shell .as-otp span{width:56px;height:64px}}
      @media (min-width:640px){#auth-shell.as--centered .as-card{padding:40px}}
      @media (min-width:768px){#auth-shell .as-topbar{padding:0 40px}}
      @media (min-width:768px) and (max-width:1023px){#auth-shell .as-card{max-width:500px}}
      /* Register, step 1: stepper + the three profile cards (the page's largest text, i.e. its LCP). Mirrors .auth-stepper / .auth-choice. */
      #auth-shell .as-stepper{display:flex;align-items:flex-start;margin:0;padding:0;list-style:none}
      #auth-shell .as-stepper li{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:0}
      #auth-shell .as-stepper li:not(:last-child)::after{content:'';position:absolute;top:15px;left:calc(50% + 20px);right:calc(-50% + 20px);height:2px;background:#e5e9f0}
      #auth-shell .as-stepper i{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;border:2px solid #e5e9f0;background:#fff;color:#5b6b80;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-style:normal;font-size:13px;font-weight:600}
      #auth-shell .as-stepper li:first-child i{border-color:#009fe3;background:#009fe3;color:#fff;transform:scale(1.12);box-shadow:0 0 0 5px rgba(0,159,227,.16)}
      #auth-shell .as-stepper span{font-size:12px;font-weight:500;color:#5b6b80;white-space:nowrap}
      #auth-shell .as-stepper li:first-child span{color:#0077b6;font-weight:600}
      #auth-shell .as-card--register .as-title{margin-top:32px}
      #auth-shell .as-choices{display:grid;gap:12px;margin-top:32px}
      #auth-shell .as-choice{display:flex;align-items:center;gap:16px;width:100%;min-height:100px;padding:16px 20px;border:2px solid #e5e9f0;border-radius:16px;background:#fff;text-align:left}
      #auth-shell .as-choice__radio{flex-shrink:0;width:24px;height:24px;border-radius:999px;border:2px solid #94a3b8;background:#fff}
      #auth-shell .as-choice__icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:48px;height:48px;border-radius:999px;background:var(--c-bg);color:var(--c-fg)}
      #auth-shell .as-choice__text{min-width:0}
      #auth-shell .as-choice__title{font-family:Poppins,ui-sans-serif,system-ui,sans-serif;font-size:18px;font-weight:600;line-height:1.2;color:var(--as-navy)}
      #auth-shell .as-choice__desc{margin-top:4px;font-size:14px;line-height:1.45;color:#475569}
      #auth-shell .as-card--register .as-btn{margin-top:28px}
      #auth-shell .as-muted{margin-top:32px;text-align:center;font-size:14px;color:#475569}
      #auth-shell .as-muted b{font-weight:600;color:#0077b6}
      #auth-shell .as-trust{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:32px;text-align:center;font-size:12px;color:#5b6b80}
      #auth-shell .as-trust p{display:inline-flex;align-items:center;gap:8px}
      #auth-shell .as-trust img{display:block;width:20px;height:20px}
      #auth-shell .as-trust i{font-style:normal;color:#94a3b8}
      @media (min-width:1024px){
        #auth-shell.as--split{grid-template-columns:55fr 45fr}
        #auth-shell.as--split .as-panel{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:100svh;padding:clamp(48px,7vh,80px) clamp(48px,5.5vw,80px);background:var(--as-navy);color:#fff;isolation:isolate;overflow:hidden}
        #auth-shell.as--split .as-panel__bg{position:absolute;inset:0;z-index:-2}
        #auth-shell.as--split .as-panel__bg img{width:100%;height:100%;object-fit:cover;object-position:62% 40%}
        #auth-shell.as--split .as-panel__overlay{position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,rgba(10,22,40,.92) 0%,rgba(10,22,40,.75) 100%)}
        #auth-shell.as--split .as-panel__head{margin:60px 0 0;font-family:Poppins,ui-sans-serif,system-ui,sans-serif;font-weight:700;font-size:clamp(36px,3.4vw,48px);line-height:1.1;letter-spacing:-.02em;color:#fff}
        #auth-shell.as--split .as-topbar .as-brand{display:none}
        #auth-shell.as--split .as-topbar{justify-content:flex-end}
      }
    </style>
    <!-- Kick off route-critical images (and, outside the static shells, web fonts) before any JavaScript runs. -->
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, '') || '/';
        var authPaths = ['/login', '/register', '/verify', '/forgot-password', '/reset-password'];
        /*
         * Routes with a static shell activate the web fonts later (see the shell
         * script at the end of <body>): the shell text renders with the
         * metric-compatible fallback, so the fonts' CSS is kept out of the
         * critical path and off the network until the shell has painted.
         */
        window.__eloyerFonts = function () {
          var fonts = document.getElementById('app-fonts');
          if (!fonts || fonts.rel) return;
          fonts.as = 'style';
          fonts.onload = function () {
            this.onload = null;
            this.rel = 'stylesheet';
          };
          fonts.rel = 'preload';
        };
        if (authPaths.indexOf(path) === -1 && path !== '/') window.__eloyerFonts();
        if (path === '/') {
          // Same candidates as the shell's and Hero's <picture>: below the desktop
          // breakpoint the 1600w file is never a candidate (the photo sits under a
          // 75–95 % overlay, so a 1024w source is indistinguishable on 3× phones).
          [
            { media: '(max-width: 1023px)', srcset: '/landing/hero-kinshasa-750.webp 750w, /landing/hero-kinshasa-1024.webp 1024w' },
            { media: '(min-width: 1024px)', srcset: '/landing/hero-kinshasa-750.webp 750w, /landing/hero-kinshasa-1024.webp 1024w, /landing/hero-kinshasa.webp 1600w' },
          ].forEach(function (candidate) {
            var heroPreload = document.createElement('link');
            heroPreload.rel = 'preload';
            heroPreload.as = 'image';
            heroPreload.type = 'image/webp';
            heroPreload.media = candidate.media;
            heroPreload.setAttribute('imagesrcset', candidate.srcset);
            heroPreload.setAttribute('imagesizes', '100vw');
            heroPreload.setAttribute('fetchpriority', 'high');
            document.head.appendChild(heroPreload);
          });
        }
        if (path === '/login' || path === '/register') {
          var logo = document.createElement('link');
          logo.rel = 'preload';
          logo.as = 'image';
          logo.href = '/landing/logo-kinshasa.png';
          document.head.appendChild(logo);
          if (window.matchMedia('(min-width: 1024px)').matches) {
            // Same candidates/sizes as the shell's and AuthLayout's <picture>, so all three resolve to one file.
            var panel = document.createElement('link');
            panel.rel = 'preload';
            panel.as = 'image';
            panel.type = 'image/webp';
            panel.setAttribute(
              'imagesrcset',
              '/landing/hero-kinshasa-750.webp 750w, /landing/hero-kinshasa-1024.webp 1024w, /landing/hero-kinshasa.webp 1600w'
            );
            panel.setAttribute('imagesizes', '1024px');
            panel.setAttribute('fetchpriority', 'high');
            document.head.appendChild(panel);
          }
        }
      })();
    </script>
    <title>eLoyer Kinshasa</title>
  </head>
  <body>
    <div id="root">
      <!--
        Landing shell lives in <template> so its hero image is never fetched on
        auth routes (images inside <template> do not load until cloned).
      -->
      <template id="lp-shell-tpl">
      <div id="lp-shell" aria-hidden="true">
        <header class="sh-nav">
          <div class="sh-wrap">
            <span class="sh-id">
              <img src="/landing/logo-kinshasa.png" alt="" width="48" height="48" />
              <span class="sh-sep"></span>
              <span class="sh-word">
                <span><b>eLoyer</b> <i>Kinshasa</i></span>
                <span class="sh-cap">Ville de Kinshasa</span>
              </span>
            </span>
          </div>
          <span class="sh-flag"></span>
        </header>
        <section class="sh-hero">
          <div class="sh-bg">
            <!--
              The photo stays invisible until it has fully loaded: a static image
              whose first paint happens while bytes are still arriving is recorded
              by Chrome as a *pending* LCP candidate that only becomes final on a
              later repaint — which a static shell never triggers — so the LCP
              would silently move to React's copy of the image.
            -->
            <picture>
              <source
                media="(max-width: 1023px)"
                srcset="/landing/hero-kinshasa-750.webp 750w, /landing/hero-kinshasa-1024.webp 1024w"
                sizes="100vw"
                type="image/webp"
              />
              <source
                srcset="/landing/hero-kinshasa-750.webp 750w, /landing/hero-kinshasa-1024.webp 1024w, /landing/hero-kinshasa.webp 1600w"
                sizes="100vw"
                type="image/webp"
              />
              <img
                src="/landing/hero-kinshasa.jpg"
                alt=""
                width="1600"
                height="1067"
                fetchpriority="high"
                decoding="sync"
                elementtiming="lp-shell-hero"
                style="visibility:hidden"
                onload="this.style.visibility=''"
                onerror="this.style.visibility=''"
              />
            </picture>
          </div>
          <div class="sh-overlay"></div>
          <div class="sh-glow"></div>
        </section>
      </div>
      </template>
      <!--
        Static app shell for auth routes: paints the branded frame (top bar + card
        skeleton, and on desktop login/register the left photo panel) straight from
        HTML. React replaces the whole #root subtree on its first commit.
      -->
      <div id="auth-shell" hidden>
        <div class="as-main">
          <span class="as-flag"></span>
          <header class="as-topbar">
            <span class="as-brand">
              <img src="/landing/logo-kinshasa.png" alt="" width="40" height="40" />
              <span class="as-word" aria-hidden="true"><b>eLoyer</b> <i>Kinshasa</i></span>
            </span>
            <span class="as-lang" aria-hidden="true"></span>
          </header>
          <main class="as-body">
            <div class="as-card">
              <div class="as-back" hidden aria-hidden="true"></div>
              <div class="as-badge" hidden aria-hidden="true"></div>
              <h1 class="as-title">Se connecter</h1>
              <p class="as-sub">Accédez à votre espace personnel</p>
              <div class="as-tabs" hidden aria-hidden="true"><span></span><span></span></div>
              <div class="as-otp" hidden aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span><span></span>
              </div>
              <div class="as-fields">
                <div class="as-field" aria-hidden="true"></div>
                <div class="as-field" aria-hidden="true"></div>
              </div>
              <div class="as-btn" aria-hidden="true"></div>
            </div>
          </main>
        </div>
      </div>
      <!--
        Register, step 1: real stepper, title and the three profile cards so the
        page's LCP text paints from HTML. Cloned into .as-card on /register; React
        renders the identical geometry (see ProfileSelector / AuthStepper).
      -->
      <template id="as-register-tpl">
        <ol class="as-stepper" aria-hidden="true">
          <li><i>1</i><span>Profil</span></li>
          <li><i>2</i><span>Informations</span></li>
          <li><i>3</i><span>Sécurité</span></li>
        </ol>
        <h1 class="as-title">Je suis…</h1>
        <p class="as-sub">Sélectionnez votre profil pour continuer.</p>
        <div class="as-choices" aria-hidden="true">
          <div class="as-choice" style="--c-bg:rgba(0,159,227,.12);--c-fg:#0077b6">
            <span class="as-choice__radio"></span>
            <span class="as-choice__icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.6-3.7 3.7-6 7.5-6s6.9 2.3 7.5 6"/></svg></span>
            <span class="as-choice__text"><p class="as-choice__title">Locataire</p><p class="as-choice__desc">Je loue un logement et je souhaite payer mon loyer en ligne.</p></span>
          </div>
          <div class="as-choice" style="--c-bg:rgba(255,221,0,.22);--c-fg:#0a1628">
            <span class="as-choice__radio"></span>
            <span class="as-choice__icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-6h5v6"/></svg></span>
            <span class="as-choice__text"><p class="as-choice__title">Bailleur</p><p class="as-choice__desc">Je possède un ou plusieurs biens que je souhaite louer.</p></span>
          </div>
          <div class="as-choice" style="--c-bg:rgba(239,62,66,.12);--c-fg:#d9262b">
            <span class="as-choice__radio"></span>
            <span class="as-choice__icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20.5h16"/><path d="M6 20.5v-15l6-2.5 6 2.5v15"/><path d="M9 9h1.5M13.5 9H15M9 12.5h1.5M13.5 12.5H15M9 16h1.5M13.5 16H15"/></svg></span>
            <span class="as-choice__text"><p class="as-choice__title">Agence immobilière</p><p class="as-choice__desc">Je gère les biens et contrats de mes clients.</p></span>
          </div>
        </div>
        <div class="as-btn" aria-hidden="true">Continuer<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h15M13 5.5l6.5 6.5-6.5 6.5"/></svg></div>
        <p class="as-muted" aria-hidden="true">Déjà un compte ? <b>Se connecter</b></p>
        <div class="as-trust" aria-hidden="true">
          <p><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><path d="M12 14.5v2"/></svg><span>Connexion sécurisée par chiffrement de bout en bout</span></p>
          <p><img src="/landing/logo-kinshasa.png" alt="" width="20" height="20" /><span>Ville de Kinshasa</span><i>·</i><span>Conditions Générales d'Utilisation</span><i>·</i><span>Politique de Confidentialité</span></p>
        </div>
      </template>
    </div>
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, '') || '/';
        var authPaths = ['/login', '/register', '/verify', '/forgot-password', '/reset-password'];
        var isLanding = path === '/';
        var isAuth = authPaths.indexOf(path) !== -1;
        var isSplit = path === '/login' || path === '/register';
        var root = document.getElementById('root');

        var activateFonts = window.__eloyerFonts || function () {};

        if (isLanding && root) {
          var tpl = document.getElementById('lp-shell-tpl');
          if (tpl && tpl.content) root.appendChild(tpl.content.cloneNode(true));
          /*
           * The hero photo is the landing LCP. Fonts (and, in production, the app
           * bundle — the loader in vite.config.ts listens for the event below) start
           * only once it has been presented, so nothing shares bandwidth with the LCP
           * image. Element Timing reports the presentation itself; browsers without
           * it fall back to the load event plus two frames.
           */
          var hero = root.querySelector('#lp-shell .sh-bg img');
          var painted = false;
          var shellPainted = function () {
            if (painted) return;
            painted = true;
            activateFonts();
            document.dispatchEvent(new Event('eloyer:shellpainted'));
          };
          var afterFrame = function (fn) {
            requestAnimationFrame(function () {
              requestAnimationFrame(fn);
            });
          };
          if (!hero) {
            afterFrame(shellPainted);
          } else {
            var timingId = hero.getAttribute('elementtiming');
            var types = window.PerformanceObserver && PerformanceObserver.supportedEntryTypes;
            if (timingId && types && types.indexOf('element') !== -1) {
              var po = new PerformanceObserver(function (list) {
                if (!list.getEntries().some(function (e) { return e.identifier === timingId; })) return;
                po.disconnect();
                shellPainted();
              });
              po.observe({ type: 'element', buffered: true });
            } else {
              var onLoad = function () { afterFrame(shellPainted); };
              // `complete` flips before the load event (and the onload reveal) has run.
              if (hero.style.visibility === 'hidden' || !hero.complete) hero.addEventListener('load', onLoad, { once: true });
              else onLoad();
            }
            hero.addEventListener('error', function () { afterFrame(shellPainted); }, { once: true });
          }
          setTimeout(shellPainted, 2500);
        }

        if (!isAuth) {
          var auth = document.getElementById('auth-shell');
          if (auth) auth.remove();
          return;
        }

        var shell = document.getElementById('auth-shell');
        if (!shell) return;

        /*
         * The shell's text is the LCP. It paints in the fallback font; if the web
         * fonts landed before React mounted, React's identical text would repaint
         * wider (Inter is wider than the system fallback) and Chrome would move LCP
         * to that later paint. Web fonts are therefore activated only once React has
         * swapped the shell out — one frame later, so both paint from the same metrics.
         */
        if (root && 'MutationObserver' in window) {
          var mo = new MutationObserver(function () {
            if (shell.isConnected) return;
            mo.disconnect();
            requestAnimationFrame(activateFonts);
          });
          mo.observe(root, { childList: true });
        }
        window.addEventListener('load', function () {
          setTimeout(activateFonts, 3000);
        });

        shell.hidden = false;
        shell.removeAttribute('aria-hidden');
        shell.className += isSplit ? ' as--split' : ' as--centered';

        var title = shell.querySelector('.as-title');
        var sub = shell.querySelector('.as-sub');
        var badge = shell.querySelector('.as-badge');
        var back = shell.querySelector('.as-back');
        var otp = shell.querySelector('.as-otp');
        var tabs = shell.querySelector('.as-tabs');
        var fields = shell.querySelector('.as-fields');
        var btn = shell.querySelector('.as-btn');

        if (isSplit && window.matchMedia('(min-width: 1024px)').matches) {
          var aside = document.createElement('aside');
          aside.className = 'as-panel';
          aside.innerHTML =
            '<div class="as-panel__bg"><picture><source srcset="/landing/hero-kinshasa-750.webp 750w, /landing/hero-kinshasa-1024.webp 1024w, /landing/hero-kinshasa.webp 1600w" sizes="1024px" type="image/webp" /><img src="/landing/hero-kinshasa.jpg" alt="" width="1600" height="1067" fetchpriority="high" decoding="sync" elementtiming="auth-shell-panel" style="visibility:hidden" onload="this.style.visibility=\'\'" onerror="this.style.visibility=\'\'" /></picture></div><div class="as-panel__overlay"></div><p class="as-panel__head">Bienvenue sur eLoyer Kinshasa</p>';
          shell.insertBefore(aside, shell.firstChild);
        }
        if (!isSplit && badge) badge.hidden = false;

        if (path === '/verify') {
          if (title) title.textContent = 'Vérifiez votre numéro';
          if (sub) sub.textContent = 'Nous avons envoyé un code à 6 chiffres au';
          if (otp) otp.hidden = false;
          if (fields) fields.style.display = 'none';
          if (btn) btn.style.display = 'none';
        } else if (path === '/forgot-password') {
          if (back) back.hidden = false;
          if (badge) badge.className = 'as-badge as-badge--yellow';
          if (title) title.textContent = 'Mot de passe oublié ?';
          if (sub) sub.textContent = 'Entrez votre numéro de téléphone ou votre email.';
          if (fields) fields.querySelector('.as-field:last-child').style.display = 'none';
        } else if (path === '/reset-password') {
          if (badge) badge.hidden = false;
          if (title) title.textContent = 'Nouveau mot de passe';
          if (sub) sub.textContent = 'Choisissez un nouveau mot de passe fort.';
        } else if (path === '/register') {
          var card = shell.querySelector('.as-card');
          var regTpl = document.getElementById('as-register-tpl');
          if (card && regTpl && regTpl.content) {
            card.className += ' as-card--register';
            card.textContent = '';
            card.appendChild(regTpl.content.cloneNode(true));
          }
        } else if (path === '/login') {
          if (tabs) tabs.hidden = false;
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
